services:
  report_and_analysis:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /home/code
    container_name: report_and_analysis
    tty: true
    stdin_open: true
    volumes:
      - .:/home/code
    ports:
      - "3000:3000"
      - "9229:9229"
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-report_and_analysis}
    depends_on:
      postgres:
        condition: service_healthy
    command: "yarn start:dev"

  postgres:
    image: postgres:17-alpine
    container_name: report_and_analysis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-report_and_analysis}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-report_and_analysis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    container_name: report_and_analysis_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
